<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>등불노트 · 기도제목 보내기</title>
<meta name="description" content="이름을 고르고 기도제목을 써서 리더에게 보내 주세요">
<meta property="og:type" content="website">
<meta property="og:title" content="🙏 기도제목 보내기 · 등불노트">
<meta property="og:description" content="눌러서 내 이름 고르고 기도제목을 써 주세요">
<meta property="og:image" content="https://stonson-boop.github.io/mn/og.png">
<meta name="theme-color" content="#3d6a4f">
<!--
  등불노트 · 기도제목 쓰기 페이지 (서버 없이 동작)
  - 링크 ?p=코드 안에 [리더|셀|문자번호|셀가족 이름] 이 들어 있습니다. 서버에 아무것도 저장하지 않습니다.
  - 셀 식구가 이름을 고르고 기도제목을 쓰면 → 카톡(공유) 또는 문자로 리더에게 1:1로 보냅니다.
  - 리더는 받은 글을 길게 눌러 복사 → 등불노트를 열면 셀 기도제목에 정리됩니다.
  - (새 방식) 리더가 등불노트에서 '구글로 자동 받기'를 켜면 링크에 리더 구글 설문지 주소번호가 담겨,
    [리더에게 보내기] 한 번으로 리더 본인 구글 설문지에 들어가고 리더 앱이 알아서 정리합니다. (운영자 서버 없음)
  - (새 방식) '모임에서 QR로 받기'를 켜면 [모임에서 QR로 보여 주기] → 리더가 앱으로 찍기. 이 페이지가 ?r= 로 열리면 QR 내용 보기.
-->
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1f2a23;--sub:#6b766e;--line:#dfe5df;--accent:#3d6a4f;--accent-ink:#fff;--soft:#e2ece5;--warn:#a2452f;--warn-soft:#fbe9e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1a221d;--ink:#e8eee9;--sub:#9aa69d;--line:#2c3830;--accent:#7db592;--accent-ink:#0f1a14;--soft:#22332a;--warn:#e48a72;--warn-soft:#3a221c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.top b{font-size:15px;color:var(--accent);letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0 0 18px;line-height:1.5}
.lab{display:block;font-size:14px;color:var(--sub);margin:16px 0 8px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:140px;resize:vertical;line-height:1.55}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.chk.urg{color:var(--warn);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{flex:1 1 160px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{color:var(--sub);font-size:13px;line-height:1.55;margin:12px 0 0}
.done{display:none;margin-top:16px;background:var(--soft);border-radius:14px;padding:16px;font-size:15px;line-height:1.7}
.done>b{display:block;font-size:17px;margin-bottom:4px}
.done ol{margin:6px 0 0;padding-left:22px}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:14px;font-size:15px;line-height:1.6}
.kakao{background:#fff7d6;color:#3c2f00;border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:15px;line-height:1.6}
.kakao b{display:block;font-size:16px;margin-bottom:4px}
.kakao .btn{min-height:44px;font-size:15px;margin-top:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kakao{background:#3a3214;color:#f5e7b0}}
[hidden]{display:none!important}
.other{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--sub)}
.other button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;min-height:40px;cursor:pointer}
.qrv{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qrv b{font-size:17px;line-height:1.5}
.qrv .qr{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line);width:min(78vw,320px)}
.qrv .qr svg{display:block;width:100%;height:auto}
.qrv .btn{flex:none}
.rcv{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.7}
.rcv b{display:block;font-size:16px;margin-bottom:2px}
.app{display:block;text-align:center;margin:18px 0 0;color:var(--sub);font-size:14px}
.app a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b id="brand">📖 등불노트</b></div>
  <div id="kakao"></div>
  <div class="card" id="main"></div>
  <p class="app" id="appLine"></p>
</div>

const PAGE_LANG = "ko";   /* 이 페이지 폴더의 언어 (mn/ = 한국어, mn/en/ = 영어 …) · 폰 언어를 못 찾으면 이 언어로 */
const LANG=(()=>{const L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"ko"]).map(x=>String(x).toLowerCase());
 for(const x of L){const b=x.split(/[-_]/)[0];if(b==="ko")return"ko";if(b==="in"||b==="ms")return"id";if(b==="fil")return"tl";if(PAGE_TR[b])return b}return PAGE_LANG||"en"})();
const T=(k,...a)=>((LANG!=="ko"&&PAGE_TR[LANG]&&PAGE_TR[LANG][k])||k).replace(/\{(\d+)\}/g,(_,i)=>a[+i]??"");
const LOC={ko:"ko-KR",en:"en-US",ja:"ja-JP",zh:"zh-CN",id:"id-ID",vi:"vi-VN",tl:"fil-PH",es:"es-419",pt:"pt-BR",fr:"fr-FR",de:"de-DE"}[LANG]||"en-US";
document.documentElement.lang=LANG;document.title=T("등불노트 · 기도제목 보내기");
/* 받는 리더 앱이 어떤 언어든 읽을 수 있게 붙이는 줄 (앱의 b64e 와 같음) */
function b64e(o){const s=unescape(encodeURIComponent(JSON.stringify(o)));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
/* ── 링크 풀기 (앱의 js/links.js 와 같은 방식: 한글 1글자 = 15비트) ── */
const B64A="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function unpackK(s){let b="";for(const ch of s){const v=B64A.indexOf(ch);if(v<0)break;b+=v.toString(2).padStart(6,"0")}
 let o="",i=0;while(b.length-i>=9){if(b[i]==="0"){if(b.length-i<15)break;o+=String.fromCharCode(0xAC00+parseInt(b.slice(i+1,i+15),2));i+=15}
 else if(b[i+1]==="0"){o+=String.fromCharCode(parseInt(b.slice(i+2,i+9),2));i+=9}
 else{if(b.length-i<18)break;o+=String.fromCharCode(parseInt(b.slice(i+2,i+18),2));i+=18}}return o}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)||""}catch(_){return""}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};

// 이번 주(일~토) — 앱과 같은 회차 번호(r+일요일 날짜)도 함께
const WEEK0=(()=>{const t=new Date();t.setDate(t.getDate()-t.getDay());return t})();
const ymd=t=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
function weekTitle(){const t=WEEK0,n=Math.ceil(t.getDate()/7);
 if(LANG==="ko")return `${t.getMonth()+1}월 ${["첫째","둘째","셋째","넷째","다섯째"][n-1]} 주`;
 let mon="";try{mon=new Intl.DateTimeFormat(LOC,{month:"long"}).format(t)}catch(_){mon=String(t.getMonth()+1)}
 return T("{0} {1}째 주",mon,n)}
const ROUND=(()=>{const u=new Date(WEEK0);u.setDate(u.getDate()+6);return{id:"r"+ymd(WEEK0).replace(/-/g,""),from:ymd(WEEK0),until:ymd(u)}})();

let R=null;try{if(code){const a=unpackK(code).split("|");R={leader:a[0]||"",room:a[1]||"",phone:a[2]||"",names:(a[3]||"").split(",").filter(Boolean),rid:(a[4]||"").replace(/[^\w-]/g,""),entry:(a[5]||"").replace(/\D/g,""),qr:/q/.test(a[6]||"")}}}catch(_){R=null}
/* 받는 방법 (리더가 등불노트에서 켠 것): rid+entry = 리더 구글 설문지로 바로 보내기 · qr = 모임에서 QR로 보여 주기 */

   → 휴대폰 기본 브라우저(크롬·삼성 인터넷)로 자동으로 다시 열어서, [카톡으로 리더에게]를 누르면 공유 창이 뜨게 함 */
const IN_KAKAO=/KAKAOTALK/i.test(navigator.userAgent);
const extUrl=()=>"kakaotalk://web/openExternal?url="+encodeURIComponent(location.href);
if(IN_KAKAO&&R&&R.leader&&!NEWWAY){
 $("#kakao").innerHTML=`<div class="kakao"><b>${T("📤 브라우저로 여는 중이에요")}</b>${T("리더님에게 바로 보내는 창을 쓰려고 휴대폰 브라우저로 열어요. <b>새로 열린 화면</b>에서 이름을 고르고 써 주세요.")}<button type="button" class="btn pri" id="goExt" style="width:100%">${T("브라우저로 열기")}</button><span style="display:block;font-size:13px;margin-top:8px;opacity:.8">${T("안 열리면 이 화면에서 그대로 써도 돼요 (복사해서 붙여넣기)")}</span></div>`;
 setTimeout(()=>{location.href=extUrl()},350);
}

function message(){
 const who=$("#who").value.trim(),list=$("#list").value.split("\n").map(s=>s.replace(/^[\s·•\-]+/,"").trim()).filter(Boolean);
 if(!who){alertBox(T("이름을 골라 주세요"));return null}
 if(!list.length){alertBox(T("기도제목을 한 줄 이상 써 주세요"));$("#list").focus();return null}
 store.set("mn_name",who);
 const urg=$("#urg").checked,priv=$("#priv").checked;
 // ※ 한국어: 이 모양 그대로여야 리더 앱이 알아봅니다 (js/links.js cwMessage 와 같음)
 //   다른 언어: 사람이 읽는 글 + 맨 끝 '#MN pr:…' 한 줄 (리더 앱이 어떤 언어든 이 줄로 정리)
 if(LANG==="ko")return `${urg?"🚨 긴급 기도 · ":"🙏 "}${who}님의 기도제목 · ${WEEK}\n${priv?"🔒 리더만 보기\n":""}${list.map(x=>"· "+x).join("\n")}\n\n(리더님: 이 글을 길게 눌러 복사 → 등불노트를 열면 정리돼요)\n#등불노트 기도제목`;
 return `${urg?T("🚨 긴급 기도 · {0}님의 기도제목 · {1}",who,WEEK):T("🙏 {0}님의 기도제목 · {1}",who,WEEK)}\n${priv?T("🔒 리더만 보기")+"\n":""}${list.map(x=>"· "+x).join("\n")}\n\n${T("(리더님: 이 글을 길게 눌러 복사 → 등불노트를 열면 정리돼요)")}\n${T("#등불노트 기도제목")}\n#MN pr:${b64e({who,list,priv,urgent:urg,round:Object.assign({title:WEEK},ROUND),leader:R.leader})}`;
}
/* 기도제목 하나로 묶기 (보내는 길마다 같은 내용) */
function prData(){
 const who=$("#who").value.trim(),list=$("#list").value.split("\n").map(s=>s.replace(/^[\s·•\-]+/,"").trim()).filter(Boolean);
 if(!who){alertBox(T("이름을 골라 주세요"));return null}
 if(!list.length){alertBox(T("기도제목을 한 줄 이상 써 주세요"));$("#list").focus();return null}
 store.set("mn_name",who);
 return{who,list,urgent:$("#urg").checked,priv:$("#priv").checked};
}
/* 리더 구글 설문지에 들어가는 글: 사람이 읽는 글 + 맨 끝 '#MN pr:…' (리더 앱이 이 줄로 정리) */
function answerText(d){
 return `${d.urgent?"🚨 ":"🙏 "}${d.who} · ${WEEK}\n${d.priv?T("🔒 리더만 보기")+"\n":""}${d.list.map(x=>"· "+x).join("\n")}\n#MN pr:${b64e({who:d.who,list:d.list,priv:d.priv,urgent:d.urgent,round:Object.assign({title:WEEK},ROUND),leader:R.leader})}`;
}
function panel(html){[...$("#main").children].forEach(x=>{if(!x.classList.contains("pnl"))x.hidden=true});let p=$("#pnl");if(!p){p=document.createElement("div");p.id="pnl";p.className="pnl";$("#main").appendChild(p)}p.hidden=false;p.innerHTML=html;$("#main").scrollIntoView({behavior:"smooth",block:"start"})}
function unpanel(){const p=$("#pnl");if(p)p.remove();[...$("#main").children].forEach(x=>{if(x.id!=="done")x.hidden=false})}
async function sendG(b){
 const d=prData();if(!d)return;b.disabled=true;const lab=b.textContent;b.textContent=T("보내는 중…");
 try{await fetch(`https://docs.google.com/forms/d/e/${R.rid}/formResponse`,{method:"POST",mode:"no-cors",body:new URLSearchParams({["entry."+R.entry]:answerText(d)})});
  b.disabled=false;b.textContent=lab;$("#done").style.display="none";
  panel(`<div class="done" style="display:block;margin:0"><b>${T("✅ 리더님에게 전달됐어요")}</b>${T("리더님이 등불노트를 열면 바로 정리돼요. 함께 기도할게요 🙏")}</div><div class="btns"><button type="button" class="btn" id="backP">${T("고쳐서 다시 보내기")}</button></div>`)}
 catch(_){b.disabled=false;b.textContent=lab;alertBox(T("보내지 못했어요. 인터넷 연결을 확인하거나 아래 다른 방법으로 보내 주세요."))}
}
function showQ(){
 const d=prData();if(!d)return;$("#done").style.display="none";
 const url=`https://stonson-boop.github.io/mn/${PAGE_LANG&&PAGE_LANG!=="ko"?PAGE_LANG+"/":""}?r=${b64e({w:d.who,l:d.list,u:d.urgent?1:0,p:d.priv?1:0,r:ROUND.id,t:WEEK,ld:R.leader})}`;
 let svg="";try{qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];const q=qrcode(0,"M");q.addData(url,"Byte");q.make();svg=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(_){svg=""}
 panel(`<div class="qrv"><b>${T("리더님 폰의 등불노트에서 [📷 QR 찍기]로 이 QR을 찍어 주세요")}</b><div class="qr">${svg}</div><span class="note" style="margin:0">${T("인터넷이 없어도 돼요.")}</span><button type="button" class="btn" id="backP" style="width:100%">${T("돌아가기")}</button></div>`);
}
function alertBox(t){const d=$("#done");d.style.display="block";d.innerHTML=`<b>${esc(t)}</b>`;d.scrollIntoView({behavior:"smooth",block:"center"})}
async function copy(t){
 try{await navigator.clipboard.writeText(t);return true}catch(_){}
 try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(_){return false}
}
document.addEventListener("click",async e=>{
 if(e.target.closest("#goExt")){location.href=extUrl();return}
 const c=e.target.closest("[data-name]");
 if(c){document.querySelectorAll("[data-name]").forEach(b=>b.classList.toggle("on",b===c));$("#who").value=c.dataset.name;$("#list").focus();return}
 if(e.target.closest("#sendG")){sendG(e.target.closest("#sendG"));return}
 if(e.target.closest("#showQ")){showQ();return}
 if(e.target.closest("#backP")){unpanel();return}
 if(e.target.closest("#sendK")){
  const m=message();if(!m)return;
  // 1) 공유 창이 되는 브라우저(크롬 등): 공유 창 → 카카오톡 → 리더 선택
  if(navigator.share){try{await navigator.share({text:m});done(false);return}catch(err){if(err&&err.name==="AbortError")return}}
  // 2) 카톡 안 브라우저: 글을 복사 → 리더 1:1 채팅방에 붙여넣기
  const ok=await copy(m);done(true,ok,m);return}
 if(e.target.closest("#sendS")){const m=message();if(!m)return;location.href=`sms:${R.phone}?body=${encodeURIComponent(m)}`;done(false);return}
});
function done(copied,ok,m){
 const d=$("#done");d.style.display="block";
 const K=LANG==="ko";
 d.innerHTML=copied?(ok?`<b>${T("✅ 기도제목이 복사됐어요")}</b>${T("이제 리더님에게 붙여넣기만 하면 됩니다.")}<ol><li>${K?"왼쪽 위 <b>✕</b> 또는 뒤로 가기로 카톡으로 돌아가기":T("왼쪽 위 <b>✕</b> 또는 뒤로 가기로 채팅 앱으로 돌아가기")}</li><li>${T("<b>{0}</b>님과의 1:1 채팅방 열기",esc(R.leader))}</li><li>${T("입력칸을 <b>길게 눌러 [붙여넣기]</b> → 보내기")}</li></ol>`
  :`<b>${T("복사가 안 됐어요")}</b>${T("아래 글을 길게 눌러 전체 복사한 뒤 {0}님에게 보내 주세요.",esc(R.leader))}<textarea readonly style="margin-top:8px;min-height:120px">${esc(m)}</textarea>`)
  :`<b>${T("✅ 보내기 창을 열었어요")}</b>${K?`[카카오톡] → <b style="display:inline;font-size:15px">${esc(R.leader)}</b>님을 골라 보내면 끝입니다. 함께 기도할게요 🙏`:T("채팅 앱 → <b>{0}</b>님을 골라 보내면 끝입니다. 함께 기도할게요 🙏",esc(R.leader))}`;
 d.scrollIntoView({behavior:"smooth",block:"center"});
}
</script>
</body>
</html>
